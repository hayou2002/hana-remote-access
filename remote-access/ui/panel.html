<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>远程访问管理面板</title>
  <script>
    /* 宿主把当前主题通过 iframe URL 参数下发：hana-css（当前主题的完整 CSS）、
       以及 auto 模式的 hana-palette-{light,dark}-css。挂上它，面板才能随宿主主题一起变。
       没有参数时（离线预览）退回 panel.css 的暖色默认值。 */
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var href = p.get("hana-css");
        var appearance = p.get("hana-theme-appearance");
        if (appearance) {
          var themed = p.get("hana-palette-" + appearance + "-css");
          if (themed) href = themed;
        }
        if (!href) return;
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        link.setAttribute("data-host-theme", "1");
        document.head.insertBefore(link, document.head.firstChild);
      } catch (e) {
        /* 主题不可用不影响面板功能 */
      }
    })();
  </script>
  <link rel="stylesheet" href="./assets/panel.css">
</head>
<body>
  <main class="panel" id="panel" aria-busy="true">
    <header class="panel__head">
      <span class="brand" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a9 9 0 1 0 9 9"/>
          <path d="M12 3a9 9 0 0 1 9 9"/>
          <path d="M3 12h18"/>
          <path d="M12 3c2.5 2.4 3.8 5.4 3.8 9s-1.3 6.6-3.8 9c-2.5-2.4-3.8-5.4-3.8-9S9.5 5.4 12 3z"/>
        </svg>
      </span>
      <div class="panel__title">
        <h1>远程访问</h1>
        <div class="panel__meta">
          <span class="dot" id="health-dot" data-state="unknown" aria-hidden="true"></span>
          <span id="health-text">正在检查…</span>
          <span class="sep">·</span>
          <span id="app-version">v—</span>
        </div>
      </div>
      <button class="btn btn--ghost btn--sm" id="refresh" type="button" title="重新检查">刷新</button>
    </header>

    <!-- 未安装引导 -->
    <section class="card card--warn hidden" id="sec-missing">
      <h2 class="card__title">还没装 cftunnel</h2>
      <p class="card__body">
        本面板由开源工具 <strong>cftunnel</strong> 驱动（MIT 协议）。请先安装它，再回到这里配置。
      </p>
      <div class="row">
        <button class="btn btn--primary" id="open-releases" type="button">打开下载页</button>
        <button class="btn btn--ghost" id="open-docs" type="button">查看文档</button>
      </div>
    </section>

    <!-- 状态总览 -->
    <section class="card" id="sec-status">
      <h2 class="card__title">
        <span id="status-badge" class="badge">已停止</span>
        <span id="mode-label" class="muted"></span>
      </h2>
      <dl class="kv" id="status-kv"></dl>
      <div class="row row--actions">
        <button class="btn btn--primary" id="btn-up" type="button">启动隧道</button>
        <button class="btn btn--danger-outline" id="btn-down" type="button">停止隧道</button>
        <button class="btn btn--ghost" id="btn-open" type="button" disabled>打开地址</button>
        <button class="btn btn--ghost" id="btn-copy" type="button" disabled>复制地址</button>
      </div>
    </section>

    <!-- 临时分享 -->
    <section class="card" id="sec-quick">
      <h2 class="card__title">临时分享</h2>
      <p class="card__hint">给一个端口起一条临时隧道，适合快速调试或临时给别人看。进程停止即失效。</p>
      <div class="row">
        <label class="field">
          <span class="field__label">端口</span>
          <input class="input" id="quick-port" type="number" inputmode="numeric" placeholder="如 8080" />
        </label>
        <button class="btn btn--primary" id="btn-quick" type="button">开启临时隧道</button>
      </div>
      <div class="quick-result hidden" id="quick-result">
        <span class="quick-url" id="quick-url"></span>
        <button class="btn btn--ghost btn--sm" id="quick-copy" type="button">复制</button>
      </div>
    </section>

    <!-- 路由管理 -->
    <section class="card" id="sec-routes">
      <h2 class="card__title">穿透路由</h2>
      <div id="routes-list" class="routes"></div>
      <div class="row row--add">
        <label class="field">
          <span class="field__label">名称</span>
          <input class="input input--sm" id="route-name" type="text" placeholder="如 web-demo" />
        </label>
        <label class="field">
          <span class="field__label">本地端口</span>
          <input class="input input--sm" id="route-local" type="number" placeholder="8080" />
        </label>
        <label class="field">
          <span class="field__label">远程端口</span>
          <input class="input input--sm" id="route-remote" type="number" placeholder="同本地" />
        </label>
        <button class="btn btn--ghost" id="btn-add-route" type="button">添加</button>
      </div>
    </section>

    <!-- 诊断与日志 -->
    <section class="card" id="sec-diag">
      <h2 class="card__title">诊断与日志</h2>
      <div class="row">
        <button class="btn btn--ghost" id="btn-check" type="button">链路诊断</button>
        <button class="btn btn--ghost" id="btn-logs" type="button">查看隧道日志</button>
      </div>
      <pre class="pre hidden" id="diag-out"></pre>
    </section>

    <!-- 自启动 -->
    <section class="card" id="sec-auto">
      <h2 class="card__title">开机与自启动</h2>
      <label class="switch">
        <input type="checkbox" id="auto-start" />
        <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
        <span class="switch__label">随 Hana 启动时自动拉起隧道</span>
      </label>
      <div class="row">
        <button class="btn btn--ghost btn--sm" id="btn-svc-install" type="button">注册为系统服务</button>
        <button class="btn btn--ghost btn--sm" id="btn-svc-uninstall" type="button">取消系统服务</button>
      </div>
      <p class="card__hint">系统服务让隧道在 Hana 没开时也能保持在线（需管理员权限）。</p>
    </section>

    <!-- 底部操作 -->
    <section class="card card--flat">
      <div class="row">
        <button class="btn btn--ghost btn--sm" id="btn-settings" type="button">打开设置</button>
        <button class="btn btn--ghost btn--sm" id="btn-update" type="button">检查更新</button>
        <span class="muted" id="updated"></span>
      </div>
    </section>

    <!-- 运行输出 -->
    <pre class="pre log hidden" id="run-log"></pre>

    <!-- 确认条（危险动作） -->
    <div class="confirm hidden" id="confirm-bar" role="dialog" aria-modal="true">
      <span class="confirm__text" id="confirm-text"></span>
      <div class="row">
        <button class="btn btn--danger" id="confirm-ok" type="button">确认</button>
        <button class="btn btn--ghost" id="confirm-cancel" type="button">取消</button>
      </div>
    </div>
  </main>
  <script type="module" src="./assets/panel.js"></script>
</body>
</html>
