<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf9f4"/>
      <stop offset="1" stop-color="#f6ede2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98a4e"/>
      <stop offset="1" stop-color="#b0653a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 地球/网络：外圈 + 经线 + 纬线 -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="url(#ring)" stroke-width="20"/>
  <ellipse cx="256" cy="256" rx="56" ry="132" fill="none" stroke="url(#ring)" stroke-width="20"/>
  <path d="M124 256h264" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round"/>
  <path d="M150 190a140 140 0 0 0 212 0" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round" opacity="0.55"/>
  <path d="M150 322a140 140 0 0 1 212 0" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round" opacity="0.55"/>
  <!-- 穿透箭头：一条从内到外的通路 -->
  <circle cx="256" cy="256" r="26" fill="#b0653a"/>
</svg>
