<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 z" fill="#c2703d"/>
    </marker>
    <linearGradient id="tun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2703d"/><stop offset="1" stop-color="#b0653a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="400" fill="#faf7f2"/>
  <text x="48" y="46" font-size="19" font-weight="700" fill="#2f2a24">远程访问：把家门口的 Hana 递到外面</text>
  <text x="48" y="68" font-size="12.5" fill="#8d8274">App 不下场搬流量——它管配置、起进程、读状态；流量走 cftunnel 与中继服务器</text>

  <!-- 本机 -->
  <g>
    <rect x="48" y="110" width="250" height="180" rx="16" fill="#ffffff" stroke="#e6dccb" stroke-width="1.5"/>
    <text x="68" y="138" font-size="13" font-weight="700" fill="#2f2a24">你家 / 公司的电脑</text>
    <rect x="68" y="152" width="210" height="42" rx="9" fill="#f6efe6"/>
    <text x="82" y="172" font-size="11.5" font-weight="600" fill="#6f6659">Hana Server</text>
    <text x="82" y="187" font-size="11" fill="#8d8274">监听 127.0.0.1:8080</text>
    <rect x="68" y="202" width="210" height="42" rx="9" fill="#f6efe6"/>
    <text x="82" y="222" font-size="11.5" font-weight="600" fill="#6f6659">cftunnel + 引擎</text>
    <text x="82" y="237" font-size="11" fill="#8d8274">cloudflared / frpc</text>
    <rect x="68" y="252" width="210" height="26" rx="8" fill="url(#tun)" opacity="0.12"/>
    <text x="82" y="269" font-size="11" font-weight="600" fill="#b0653a">本 App：面板 + 工具 + 自启动</text>
  </g>

  <!-- 隧道 -->
  <g>
    <rect x="356" y="110" width="248" height="180" rx="16" fill="#ffffff" stroke="#e6dccb" stroke-width="1.5"/>
    <text x="376" y="138" font-size="13" font-weight="700" fill="#2f2a24">中继 / 边缘</text>
    <rect x="376" y="154" width="208" height="40" rx="9" fill="#f6efe6"/>
    <text x="390" y="179" font-size="11.5" fill="#6f6659">Relay：你的公网服务器 frps</text>
    <rect x="376" y="202" width="208" height="40" rx="9" fill="#f6efe6"/>
    <text x="390" y="227" font-size="11.5" fill="#6f6659">Cloud：Cloudflare 边缘 CDN</text>
    <rect x="376" y="252" width="208" height="26" rx="8" fill="#3d9a63" opacity="0.14"/>
    <text x="390" y="269" font-size="11" fill="#3d9a63">两种模式二选一，随时切换</text>
  </g>

  <!-- 外面 -->
  <g>
    <rect x="662" y="110" width="250" height="180" rx="16" fill="#ffffff" stroke="#e6dccb" stroke-width="1.5"/>
    <text x="682" y="138" font-size="13" font-weight="700" fill="#2f2a24">在外面</text>
    <rect x="682" y="152" width="210" height="42" rx="9" fill="#f6efe6"/>
    <text x="696" y="172" font-size="11.5" font-weight="600" fill="#6f6659">手机浏览器</text>
    <text x="696" y="187" font-size="11" fill="#8d8274">http://公网:端口/pad/</text>
    <rect x="682" y="202" width="210" height="42" rx="9" fill="#f6efe6"/>
    <text x="696" y="222" font-size="11.5" font-weight="600" fill="#6f6659">异地电脑 / 其他设备</text>
    <text x="696" y="237" font-size="11" fill="#8d8274">登录鉴权由 Hana 把关</text>
    <rect x="682" y="252" width="210" height="26" rx="8" fill="#b8544a" opacity="0.12"/>
    <text x="696" y="269" font-size="11" fill="#b8544a">裸公网 = 想清楚再开</text>
  </g>

  <!-- 箭头 -->
  <g stroke="url(#tun)" stroke-width="2.5" fill="none">
    <path d="M298 200 H350" marker-end="url(#arr)"/>
    <path d="M604 200 H656" marker-end="url(#arr)"/>
  </g>
  <text x="324" y="192" font-size="10.5" fill="#8d8274" text-anchor="middle">穿透</text>
  <text x="630" y="192" font-size="10.5" fill="#8d8274" text-anchor="middle">可达</text>

  <!-- 底部：App 做什么 -->
  <g>
    <rect x="48" y="316" width="864" height="62" rx="14" fill="#ffffff" stroke="#e6dccb" stroke-width="1.5"/>
    <text x="68" y="341" font-size="12" font-weight="700" fill="#2f2a24">App 负责的事</text>
    <text x="176" y="341" font-size="11.5" fill="#6f6659">状态与实况诊断（不信僵尸锁）· 一键启停 · 临时分享取地址 · 路由增删 · 随 Hana 自启动 · 系统服务注册 · 三个模型工具</text>
    <text x="68" y="364" font-size="11.5" fill="#8d8274">App 不做的事：不碰流量、不打包 cftunnel 二进制（19MB 独立更新）、不替你决定暴露哪个端口</text>
  </g>
</svg>
